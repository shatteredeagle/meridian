<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#3a2d1c"/><stop offset="1" stop-color="#120d08"/>
    </radialGradient>
    <radialGradient id="globe" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#7a5a2a"/><stop offset="1" stop-color="#2a1d0e"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#d49a2a"/>
    </linearGradient>
    <clipPath id="c"><circle cx="256" cy="262" r="168"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="88" fill="none" stroke="#d49a2a" stroke-opacity=".45" stroke-width="4"/>
  <circle cx="256" cy="262" r="168" fill="url(#globe)"/>
  <g clip-path="url(#c)" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round">
    <ellipse cx="256" cy="262" rx="118" ry="168" stroke-opacity=".7"/>
    <ellipse cx="256" cy="262" rx="62" ry="168" stroke-opacity=".7"/>
    <ellipse cx="256" cy="262" rx="168" ry="60" stroke-opacity=".55"/>
    <line x1="88" y1="262" x2="424" y2="262" stroke-opacity=".55"/>
    <line x1="256" y1="94" x2="256" y2="430" stroke-width="12"/>
  </g>
  <circle cx="256" cy="262" r="168" fill="none" stroke="url(#gold)" stroke-width="10"/>
  <!-- north tick marks -->
  <g stroke="#ffe08a" stroke-width="8" stroke-linecap="round">
    <line x1="256" y1="58" x2="256" y2="84"/>
    <line x1="256" y1="440" x2="256" y2="466"/>
    <line x1="64" y1="262" x2="90" y2="262"/>
    <line x1="422" y1="262" x2="448" y2="262"/>
  </g>
  <!-- map pin on the meridian -->
  <g transform="translate(256 150)">
    <path d="M0 52 C-34 14 -36 -4 -36 -18 A36 36 0 0 1 36 -18 C36 -4 34 14 0 52Z" fill="#7dff7d" stroke="#0e3a0e" stroke-width="6"/>
    <circle cx="0" cy="-18" r="13" fill="#0e3a0e"/>
